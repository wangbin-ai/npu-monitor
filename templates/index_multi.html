<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大模型算法实验室 NPU 资源监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#080c14;--bg2:#0d1220;--bg3:#121828;
  --card:rgba(255,255,255,.04);--border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.18);
  --blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--orange:#f59e0b;
  --purple:#8b5cf6;--pink:#ec4899;--red:#ef4444;--lime:#84cc16;
  --text:#e2e8f0;--text2:#64748b;--text3:#94a3b8;
  --r:14px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px}

/* header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 28px;background:rgba(13,18,32,.92);
  border-bottom:1px solid var(--border);backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:20;
}
.hlogo{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#fff;margin-right:10px;
}
header h1{font-size:18px;font-weight:700}
header h1 em{
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:normal;
}
.hright{display:flex;align-items:center;gap:14px}
.upd{font-size:12px;color:var(--text2)}
.upd b{color:var(--green)}
.rbtn{
  padding:7px 17px;border-radius:var(--r-sm);border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-size:13px;font-weight:500;transition:opacity .2s;
}
.rbtn:hover{opacity:.82}

/* platform toggle */
.ptoggle{
  display:flex;background:rgba(255,255,255,.07);
  border-radius:9px;padding:3px;gap:2px;
}
.ptbtn{
  padding:5px 18px;border-radius:7px;border:none;cursor:pointer;
  background:transparent;color:var(--text2);
  font-size:13px;font-weight:600;letter-spacing:.3px;transition:all .2s;
}
.ptbtn.active{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.3);
}

/* ── Row 1: stat cards ── */
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;padding:20px 28px 0;
}
.sc{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 20px 16px;position:relative;overflow:hidden;
  transition:border-color .22s,box-shadow .22s;cursor:default;
}
.sc.blue:hover  {border-color:var(--blue);  box-shadow:0 0 0 1px var(--blue),  0 0 28px color-mix(in srgb,var(--blue)   30%,transparent)}
.sc.green:hover {border-color:var(--green); box-shadow:0 0 0 1px var(--green), 0 0 28px color-mix(in srgb,var(--green)  30%,transparent)}
.sc.orange:hover{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange),0 0 28px color-mix(in srgb,var(--orange) 30%,transparent)}
.sc.red:hover   {border-color:var(--purple);box-shadow:0 0 0 1px var(--purple),0 0 28px color-mix(in srgb,var(--purple) 30%,transparent)}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.sc-label{font-size:11px;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.sc-icon{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.sc-num{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px;margin-bottom:10px}
.sc.blue .sc-num{background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sc.green .sc-num{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sc.orange .sc-num{background:linear-gradient(135deg,var(--orange),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sc.red .sc-num{background:linear-gradient(135deg,var(--red),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sc.blue  .sc-icon{background:rgba(59,130,246,.15);color:var(--blue)}
.sc.green .sc-icon{background:rgba(16,185,129,.15);color:var(--green)}
.sc.orange .sc-icon{background:rgba(245,158,11,.15);color:var(--orange)}
.sc.red   .sc-icon{background:rgba(139,92,246,.15);color:var(--purple)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-bottom:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .6s ease}
.sc.blue   .prog-fill{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.sc.green  .prog-fill{background:linear-gradient(90deg,var(--green),var(--cyan))}
.sc.orange .prog-fill{background:linear-gradient(90deg,var(--orange),var(--pink))}
.sc.red    .prog-fill{background:linear-gradient(90deg,var(--red),var(--purple))}
.sc-sub{font-size:12px;color:var(--text2)}

/* ── Row 2: charts ── */
.charts-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:14px;padding:14px 28px 0;
}
.cbox{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 20px 16px;
  display:flex;flex-direction:column;
  transition:border-color .22s,box-shadow .22s;
}
.cbox:hover{border-color:rgba(99,102,241,.45);box-shadow:0 0 0 1px rgba(99,102,241,.2),0 0 28px rgba(99,102,241,.1)}
.cbox-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;flex-shrink:0;
}
.cbox-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text)}
.cbox-title .icon{font-size:16px}
.cbox .echart{flex:1;min-height:280px;width:100%}
.over-badge-hdr{
  font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;
  background:rgba(239,68,68,.18);color:#f87171;flex-shrink:0;
}

/* ── Row 3: detail section ── */
.detail-wrap{padding:14px 28px 28px}
.detail-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.detail-hdr-left{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.detail-hdr-left .dicon{
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.detail-hint{font-size:12px;color:var(--text2)}

/* leader blocks */
#detail-list{display:flex;flex-direction:column;gap:10px}
.lb{
  border-radius:var(--r);overflow:hidden;
  border:1px solid var(--border);
  transition:border-color .22s,box-shadow .22s;
}
.lb:hover{border-color:var(--lc,var(--blue));box-shadow:0 0 0 1px var(--lc,var(--blue)),0 0 24px color-mix(in srgb,var(--lc,var(--blue)) 30%,transparent)}
.lb-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;cursor:pointer;
  background:var(--card);
  border-left:3px solid var(--lc,var(--blue));
}
.lb-row:hover{background:rgba(255,255,255,.06)}
.chev{font-size:11px;color:var(--text2);transition:transform .22s;flex-shrink:0}
.lb.open .lb-row .chev{transform:rotate(90deg)}
.lavatar{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--lc,var(--blue)),color-mix(in srgb,var(--lc,var(--blue)) 60%,#fff));
}
.linfo{flex:1;min-width:0}
.lname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmeta{font-size:12px;color:var(--text2);margin-top:2px}
.lstats{display:flex;gap:24px;flex-shrink:0}
.lstat{text-align:center}
.lstat-lbl{font-size:11px;color:var(--text2);margin-bottom:3px;white-space:nowrap}
.lstat-val{font-size:16px;font-weight:700}
.npu-val{color:var(--blue)}
.task-val{color:var(--green)}
.dur-val{color:var(--purple)}
.leader-badge{
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;
  background:rgba(245,158,11,.15);color:var(--orange);flex-shrink:0;
}

/* type sections inside leader */
.lb-body{display:none;padding:0 16px 12px;background:rgba(0,0,0,.2)}
.lb.open .lb-body{display:block}
.type-sec{margin-top:10px}
.type-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.4px;
  margin-bottom:8px;
}
.pill-dev  {background:rgba(59,130,246,.12);color:var(--blue)}
.pill-train{background:rgba(16,185,129,.12);color:var(--green)}
.pill-infer{background:rgba(245,158,11,.12);color:var(--orange)}

/* member rows */
.mb{
  border-radius:var(--r-sm);margin-bottom:6px;
  border:1px solid rgba(255,255,255,.05);overflow:hidden;
  transition:border-color .18s;
}
.mb:hover{border-color:rgba(255,255,255,.12)}
.mb-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;cursor:pointer;
  background:rgba(255,255,255,.025);
}
.mb.open .mb-row .chev{transform:rotate(90deg)}
.mavatar{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
}
.mname{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstats{display:flex;gap:16px;flex-shrink:0}
.mstat{text-align:right}
.mstat-lbl{font-size:10px;color:var(--text2)}
.mstat-val{font-size:13px;font-weight:700}

/* task rows */
.task-list{display:none;padding:4px 12px 8px;background:rgba(0,0,0,.15)}
.mb.open .task-list{display:block}
.tr{
  display:flex;align-items:center;gap:10px;
  padding:6px 8px;border-radius:6px;font-size:12px;
  color:var(--text3);transition:background .15s;
}
.tr:hover{background:rgba(255,255,255,.04)}
.tr-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--text2)}
.tr-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-npu{color:var(--blue);font-weight:600;flex-shrink:0}
.tr-dur{color:var(--text2);flex-shrink:0;min-width:30px;text-align:right}
.tr-spec{color:var(--text2);flex-shrink:0;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* loading */
#loading{
  position:fixed;inset:0;z-index:99;background:rgba(8,12,20,.8);
  backdrop-filter:blur(6px);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
.spin{
  width:34px;height:34px;border-radius:50%;
  border:3px solid rgba(255,255,255,.08);border-top-color:var(--blue);
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--text3)}
.empty-tip{padding:20px;text-align:center;color:var(--text2);font-size:13px}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><p>加载中…</p></div>

<header>
  <div style="display:flex;align-items:center">
    <div class="hlogo">N</div>
    <h1><em>大模型算法实验室 NPU 资源监控</em></h1>
  </div>
  <div class="hright">
    <div class="ptoggle">
      <button id="btn-roma" class="ptbtn"        onclick="switchPlatform('roma')">ROMA</button>
      <button id="btn-ma"   class="ptbtn active" onclick="switchPlatform('ma')">MA</button>
    </div>
    <span class="upd">更新于 <b id="upd-time">—</b></span>
    <button class="rbtn" onclick="loadData(true)">↻ 刷新</button>
  </div>
</header>

<!-- Row 1 -->
<div class="stats-row">
  <div class="sc blue">
    <div class="sc-top">
      <span class="sc-label" id="lbl-c1">开发环境 NPU</span>
      <div class="sc-icon" id="ico-c1">💻</div>
    </div>
    <div class="sc-num" id="s-c1">—</div>
    <div class="prog"><div class="prog-fill" id="p-c1" style="width:0%"></div></div>
    <div class="sc-sub" id="sub-c1">— 个实例</div>
  </div>
  <div class="sc green">
    <div class="sc-top">
      <span class="sc-label" id="lbl-c2">训练作业 NPU</span>
      <div class="sc-icon" id="ico-c2">🚀</div>
    </div>
    <div class="sc-num" id="s-c2">—</div>
    <div class="prog"><div class="prog-fill" id="p-c2" style="width:0%"></div></div>
    <div class="sc-sub" id="sub-c2">— 个任务</div>
  </div>
  <div class="sc orange">
    <div class="sc-top">
      <span class="sc-label" id="lbl-c3">推理服务 NPU</span>
      <div class="sc-icon" id="ico-c3">⚡</div>
    </div>
    <div class="sc-num" id="s-c3">—</div>
    <div class="prog"><div class="prog-fill" id="p-c3" style="width:0%"></div></div>
    <div class="sc-sub" id="sub-c3">— 个服务</div>
  </div>
  <div class="sc red">
    <div class="sc-top">
      <span class="sc-label" id="lbl-c4">NPU 合计</span>
      <div class="sc-icon">📊</div>
    </div>
    <div class="sc-num" id="s-c4">—</div>
    <div class="prog"><div class="prog-fill" id="p-c4" style="width:100%"></div></div>
    <div class="sc-sub" id="sub-c4">全部资源占用</div>
  </div>
</div>

<!-- Row 2 -->
<div class="charts-row">
  <div class="cbox">
    <div class="cbox-hdr">
      <div class="cbox-title" id="chart-quota-title"><span class="icon">◈</span>各小组 NPU 占用 / 配额</div>
      <span id="quota-over-count" style="display:none" class="over-badge-hdr"></span>
    </div>
    <div class="echart" id="chart-quota"></div>
  </div>
  <div class="cbox">
    <div class="cbox-hdr">
      <div class="cbox-title" id="chart-spec-title"><span class="icon">▦</span>各小组 NPU 占用（开发 / 训练 / 推理）</div>
    </div>
    <div class="echart" id="chart-spec"></div>
  </div>
</div>

<!-- Row 3 -->
<div class="detail-wrap">
  <div class="detail-hdr">
    <div class="detail-hdr-left">
      <div class="dicon">≡</div>
      任务详情
    </div>
    <span class="detail-hint">点击展开查看任务</span>
  </div>
  <div id="detail-list"></div>
</div>

<script>
const PAL = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#ef4444','#84cc16','#f97316','#a78bfa'];
const UNKNOWN_LEADER = '__unknown__';
let _charts = {};
let _platform = 'ma';
let _data = null;

/* ── type config for both platforms ── */
const TYPE_CFG = {
  devenv:    { label:'开发环境', pill:'pill-dev',   icon:'💻', metric:'gpu_num' },
  train:     { label:'训练作业', pill:'pill-train', icon:'🚀', metric:'gpu_num' },
  inference: { label:'推理服务', pill:'pill-infer', icon:'⚡', metric:'gpu_num' },
  ma_devenv: { label:'Notebook', pill:'pill-dev',   icon:'🔬', metric:'gpu_num' },
  ma_train:  { label:'训练实验', pill:'pill-train', icon:'🧠', metric:'gpu_num' },
};

/* ── platform switch ── */
function switchPlatform(p) {
  if (_platform === p) return;
  _platform = p;
  document.getElementById('btn-roma').classList.toggle('active', p === 'roma');
  document.getElementById('btn-ma').classList.toggle('active',   p === 'ma');
  if (_data) renderByPlatform(_data);
}

function renderByPlatform(data) {
  if (_platform === 'roma') renderRoma(data);
  else renderMa(data);
}

/* ── helpers ── */
function setText(id, t) { const el = document.getElementById(id); if (el) el.textContent = t; }
function setWidth(id, pct) { const el = document.getElementById(id); if (el) el.style.width = pct + '%'; }

/* ── generic leaderMap builder ── */
function buildLeaderMap(data, types) {
  const map = {};
  types.forEach(type => {
    const ud = (data[type] || {}).user_data || {};
    Object.entries(ud).forEach(([leader, ld]) => {
      if (!map[leader]) map[leader] = { gpu_num:0, task_count:0, max_duration:0, member_count:0, types:{} };
      map[leader].gpu_num      += ld.gpu_num;
      map[leader].task_count   += ld.task_count;
      map[leader].max_duration  = Math.max(map[leader].max_duration, ld.max_duration);
      map[leader].types[type]   = ld;
      const mc = Object.keys(ld.members).length;
      if (mc > map[leader].member_count) map[leader].member_count = mc;
    });
  });
  return Object.entries(map).sort((a,b) => b[1].gpu_num - a[1].gpu_num || b[1].task_count - a[1].task_count);
}

/* ── quota chart ── */
function initQuotaChart(leaderMap, quotas, showQuota) {
  const el = document.getElementById('chart-quota');
  if (_charts.quota) _charts.quota.dispose();
  const c = echarts.init(el);
  _charts.quota = c;

  const top = leaderMap.slice(0, 12).reverse();
  const fullNames = top.map(([l]) => l === UNKNOWN_LEADER ? '非白名单用户' : l);
  const shortNames = top.map(([l]) => {
    const n = l === UNKNOWN_LEADER ? '非白名单用户' : l;
    return n.length > 10 ? n.slice(0, 10) + '…' : n;
  });

  let overCount = 0;
  const usedData = top.map(([l, ld], i) => {
    const used  = ld.gpu_num;
    const quota = showQuota ? (quotas[l] || 0) : 0;
    const isOver = quota > 0 && used > quota;
    const isWarn = !isOver && quota > 0 && used / quota > 0.8;
    if (isOver) overCount++;
    const color = isOver ? '#ef4444' : isWarn ? '#f59e0b' : PAL[i % PAL.length];
    return {
      value: used,
      itemStyle: { color, borderRadius: [0, 3, 3, 0] },
      label: isOver
        ? { show: true, position: 'right', formatter: `+${used - quota}`,
            color: '#f87171', fontSize: 11, fontWeight: 700 }
        : { show: false },
    };
  });

  const quotaData = showQuota ? top.map(([l]) => quotas[l] || 0) : top.map(() => 0);
  const maxX = Math.max(1, ...top.map(([,ld]) => ld.gpu_num), ...quotaData) * 1.12;

  const markerData = showQuota ? top.map(([l], i) => {
    const q = quotas[l];
    return q ? { value: [q, i], itemStyle: { color: 'rgba(255,255,255,.45)' } } : null;
  }).filter(Boolean) : [];

  const series = [
    {
      type: 'bar', name: '已用', data: usedData,
      barMaxWidth: 20, z: 2,
    },
  ];
  if (showQuota) {
    series.unshift({
      type: 'bar', name: '配额', data: quotaData,
      barMaxWidth: 20, z: 1,
      itemStyle: { color: 'rgba(255,255,255,.07)', borderRadius: [0, 3, 3, 0] },
      tooltip: { show: false },
    });
    series[1].barGap = '-100%';  // 已用柱叠加在配额柱上，而非并排
    series.push({
      type: 'scatter', name: '配额线', data: markerData,
      symbol: 'rect', symbolSize: [3, 18], z: 3,
      itemStyle: { color: 'rgba(255,255,255,.4)' },
      tooltip: { show: false },
    });
  }

  c.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      backgroundColor: '#1a2035', borderColor: 'rgba(255,255,255,.1)',
      textStyle: { color: '#e2e8f0', fontSize: 12 },
      formatter(params) {
        const idx = params[0]?.dataIndex ?? 0;
        const leader = fullNames[idx];
        const used   = top[idx]?.[1]?.gpu_num ?? 0;
        const quota  = showQuota ? (quotas[leader] || 0) : 0;
        const isOver = quota > 0 && used > quota;
        const pct    = quota > 0 ? Math.round(used / quota * 100) : null;
        const sc     = isOver ? '#f87171' : pct > 80 ? '#fbbf24' : '#34d399';
        return `<div style="font-weight:700;margin-bottom:5px">${leader}</div>`
          + `<div>已用 NPU：<b style="color:${sc}">${used}</b></div>`
          + (quota ? `<div>配额 NPU：<span style="color:#94a3b8">${quota}</span></div>` : '')
          + (quota ? `<div>使用率：<b style="color:${sc}">${pct}%</b>`
              + (isOver ? ` <span style="color:#f87171;font-weight:700">超额 +${used-quota}</span>` : '')
              + `</div>` : '');
      },
    },
    grid: { left: 8, right: 48, top: 4, bottom: 4, containLabel: true },
    xAxis: {
      type: 'value', max: maxX,
      splitLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } },
      axisLabel: { color: '#64748b', fontSize: 11 },
    },
    yAxis: {
      type: 'category', data: shortNames,
      axisLabel: { color: '#94a3b8', fontSize: 11 },
      axisLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } },
    },
    series,
  });

  const badge = document.getElementById('quota-over-count');
  if (showQuota && overCount > 0) {
    badge.textContent = `${overCount} 组超额`;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  setTimeout(() => c.resize(), 0);
  window.addEventListener('resize', () => c.resize());
}

/* ── team stacked chart ── */
function initTeamChart(leaderMap, typesCfg) {
  const el = document.getElementById('chart-spec');
  if (_charts.spec) _charts.spec.dispose();
  const c = echarts.init(el);
  _charts.spec = c;

  const top = leaderMap.slice(0, 12).reverse();
  const fullNames = top.map(([l]) => l === UNKNOWN_LEADER ? '非白名单用户' : l);
  const names  = fullNames.map(n => n.length > 8 ? n.slice(0, 8) + '…' : n);

  const seriesData = typesCfg.map(({key, label, color, metric}) => ({
    name: label,
    type: 'bar',
    stack: 'total',
    data: top.map(([,ld]) => (ld.types[key] || {})[metric || 'gpu_num'] || 0),
    itemStyle: { color },
    emphasis: { itemStyle: { color: color + 'cc' } },
    barMaxWidth: 20,
  }));

  c.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      backgroundColor: '#1a2035', borderColor: 'rgba(255,255,255,.1)',
      textStyle: { color: '#e2e8f0', fontSize: 12 },
      formatter(params) {
        const i = params[0].dataIndex;
        const rows = params.filter(p => p.value > 0)
          .map(p => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:5px"></span>${p.seriesName}: <b>${p.value}</b>`).join('<br>');
        const total = params.reduce((s, p) => s + p.value, 0);
        return `<div style="font-weight:700;margin-bottom:6px">${fullNames[i]}</div>${rows}`
          + `<hr style="border-color:rgba(255,255,255,.1);margin:6px 0">`
          + `<span style="color:#94a3b8">合计:</span> <b style="color:#fff">${total}</b>`;
      },
    },
    legend: {
      top: 0, right: 0,
      textStyle: { color: '#94a3b8', fontSize: 12 }, itemWidth: 10, itemHeight: 10,
    },
    grid: { left: 8, right: 16, top: 28, bottom: 4, containLabel: true },
    xAxis: {
      type: 'value',
      splitLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } },
      axisLabel: { color: '#64748b', fontSize: 11 },
    },
    yAxis: {
      type: 'category', data: names,
      axisLabel: { color: '#94a3b8', fontSize: 11 },
      axisLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } },
    },
    series: seriesData,
  });
  setTimeout(() => c.resize(), 0);
  window.addEventListener('resize', () => c.resize());
}

/* ── detail rendering ── */
function memberCard(member, md, type, li, mi, typeIdx) {
  const cfg = TYPE_CFG[type] || {};
  const tc = { devenv:'#3b82f6', train:'#10b981', inference:'#f59e0b', ma_devenv:'#3b82f6', ma_train:'#10b981' }[type] || PAL[typeIdx % PAL.length];
  const tasks = md.tasks.map(t => `
    <div class="tr">
      <span class="tr-dot" style="background:${tc}"></span>
      <span class="tr-name" title="${t.task_name}">${t.task_name}</span>
      <span class="tr-npu" style="color:${tc}">${t.gpu_num} NPU</span>
      <span class="tr-dur">${t.duration}h</span>
      <span class="tr-spec" title="${t.spec_name}">${t.spec_name}</span>
    </div>`).join('');
  return `
  <div class="mb" id="mb-${type}-${li}-${mi}">
    <div class="mb-row" onclick="toggleMb('mb-${type}-${li}-${mi}')">
      <span class="chev">▶</span>
      <div class="mavatar" style="background:${tc}22;color:${tc}">${(member[0]||'?')}</div>
      <span class="mname" title="${member}">${member}</span>
      <div class="mstats">
        <div class="mstat"><div class="mstat-lbl">NPU</div><div class="mstat-val" style="color:${tc}">${md.gpu_num}</div></div>
        <div class="mstat"><div class="mstat-lbl">任务</div><div class="mstat-val task-val">${md.task_count}</div></div>
        <div class="mstat"><div class="mstat-lbl">最长</div><div class="mstat-val dur-val">${md.max_duration}h</div></div>
      </div>
    </div>
    <div class="task-list">${tasks || '<div class="empty-tip">无任务</div>'}</div>
  </div>`;
}

function typeSection(ld, type, li, typeIdx) {
  if (!ld) return '';
  const cfg = TYPE_CFG[type] || { label: type, pill: 'pill-dev', icon: '◈' };
  const sorted = Object.entries(ld.members).sort((a, b) => b[1].gpu_num - a[1].gpu_num);
  const cards  = sorted.map(([m, md], mi) => memberCard(m, md, type, li, `${typeIdx}${mi}`, typeIdx)).join('');
  return `
  <div class="type-sec">
    <div class="type-pill ${cfg.pill}">${cfg.icon} ${cfg.label}</div>
    ${cards}
  </div>`;
}

function leaderBlock(leader, ld, li, isUnknown, types, quotas) {
  const color = isUnknown ? '#64748b' : PAL[li % PAL.length];
  const displayName = isUnknown ? '非白名单用户' : leader;
  const quota = !isUnknown && quotas ? (quotas[leader] || 0) : 0;
  const over  = quota > 0 ? Math.max(0, ld.gpu_num - quota) : 0;
  const badge = isUnknown
    ? `<div class="leader-badge" style="background:rgba(100,116,139,.2);color:#94a3b8">⚠ 非白名单</div>`
    : `<div class="leader-badge">★ Leader</div>`;
  const typeSecs = types.map((t, ti) => typeSection(ld.types[t], t, li, ti)).join('');
  const quotaStat = quota > 0 ? `
        <div class="lstat"><div class="lstat-lbl">配额</div><div class="lstat-val" style="color:#94a3b8">${quota}</div></div>
        ${over > 0 ? `<div class="lstat"><div class="lstat-lbl">超额</div><div class="lstat-val" style="color:#ef4444">+${over}</div></div>` : ''}` : '';
  return `
  <div class="lb" id="lb-${li}" style="--lc:${color}">
    <div class="lb-row" onclick="toggleLb('lb-${li}')">
      <span class="chev">▶</span>
      <div class="lavatar" style="opacity:${isUnknown ? .6 : 1}">${isUnknown ? '?' : (displayName[0]||'?')}</div>
      <div class="linfo">
        <div class="lname" title="${displayName}">${displayName}</div>
        <div class="lmeta">${ld.member_count} 个用户 · ${ld.task_count} 个任务</div>
      </div>
      <div class="lstats">
        <div class="lstat"><div class="lstat-lbl">总 NPU</div><div class="lstat-val npu-val">${ld.gpu_num}</div></div>
        ${quotaStat}
        <div class="lstat"><div class="lstat-lbl">总任务</div><div class="lstat-val task-val">${ld.task_count}</div></div>
        <div class="lstat"><div class="lstat-lbl">最长任务</div><div class="lstat-val dur-val">${ld.max_duration}h</div></div>
      </div>
      ${badge}
    </div>
    <div class="lb-body">${typeSecs}</div>
  </div>`;
}

function renderDetail(leaderMap, types, quotas) {
  const list = document.getElementById('detail-list');
  if (!leaderMap.length) { list.innerHTML = '<div class="empty-tip">暂无数据</div>'; return; }

  const known   = leaderMap.filter(([l]) => l !== UNKNOWN_LEADER);
  const unknown = leaderMap.find(([l])  => l === UNKNOWN_LEADER);

  const knownHtml = known.map(([leader, ld], li) =>
    leaderBlock(leader, ld, li, false, types, quotas)
  ).join('');

  const unknownHtml = unknown ? `
    <div style="margin-top:10px;padding:8px 4px 2px;font-size:11px;color:#475569;letter-spacing:.6px;text-transform:uppercase">
      ⚠ 非白名单用户（${unknown[1].member_count} 人 · ${unknown[1].gpu_num} NPU）
    </div>
    ${leaderBlock(UNKNOWN_LEADER, unknown[1], known.length, true, types, quotas)}
  ` : '';

  list.innerHTML = knownHtml + unknownHtml;
}

function toggleLb(id) { document.getElementById(id).classList.toggle('open'); }
function toggleMb(id) { document.getElementById(id).classList.toggle('open'); }

/* ── ROMA render ── */
function renderRoma(data) {
  setText('lbl-c1', '开发环境 NPU'); setText('ico-c1', '💻');
  setText('lbl-c2', '训练作业 NPU'); setText('ico-c2', '🚀');
  setText('lbl-c3', '推理服务 NPU'); setText('ico-c3', '⚡');
  setText('lbl-c4', 'NPU 合计');
  setText('sub-c4', '全部资源占用');

  const totals = { devenv:0, train:0, inference:0 };
  const counts = { devenv:0, train:0, inference:0 };
  ['devenv','train','inference'].forEach(t => {
    const ud = (data[t]||{}).user_data || {};
    Object.values(ud).forEach(ld => { totals[t] += ld.gpu_num; counts[t] += ld.task_count; });
  });

  const grand = totals.devenv + totals.train + totals.inference;
  setText('s-c1', totals.devenv);  setText('s-c2', totals.train);
  setText('s-c3', totals.inference); setText('s-c4', grand);

  const pct = v => grand > 0 ? Math.round(v/grand*100) : 0;
  setWidth('p-c1', pct(totals.devenv));
  setWidth('p-c2', pct(totals.train));
  setWidth('p-c3', pct(totals.inference));
  setWidth('p-c4', 100);

  setText('sub-c1', `${counts.devenv} 个实例`);
  setText('sub-c2', `${counts.train} 个任务`);
  setText('sub-c3', `${counts.inference} 个服务`);

  const leaderMap = buildLeaderMap(data, ['devenv','train','inference']);

  setText('chart-quota-title', '◈  各小组 NPU 占用 / 配额');
  setText('chart-spec-title',  '▦  各小组 NPU 占用（开发 / 训练 / 推理）');
  document.getElementById('chart-quota-title').innerHTML =
    '<span class="icon">◈</span>各小组 NPU 占用 / 配额';
  document.getElementById('chart-spec-title').innerHTML =
    '<span class="icon">▦</span>各小组 NPU 占用（开发 / 训练 / 推理）';

  initQuotaChart(leaderMap, data.quotas || {}, true);
  initTeamChart(leaderMap, [
    { key:'devenv',    label:'开发环境', color:'#3b82f6', metric:'gpu_num' },
    { key:'train',     label:'训练作业', color:'#10b981', metric:'gpu_num' },
    { key:'inference', label:'推理服务', color:'#f59e0b', metric:'gpu_num' },
  ]);
  renderDetail(leaderMap, ['devenv','train','inference'], data.quotas || {});
}

/* ── MA render ── */
function renderMa(data) {
  setText('lbl-c1', 'Notebook NPU'); setText('ico-c1', '🔬');
  setText('lbl-c2', '训练作业 NPU'); setText('ico-c2', '🧠');
  setText('lbl-c3', '活跃用户');     setText('ico-c3', '👥');
  setText('lbl-c4', 'NPU 合计');
  setText('sub-c4', '全部资源占用');

  const maTypes = ['ma_devenv','ma_train'];
  const counts = { ma_devenv:0, ma_train:0 };
  const npus   = { ma_devenv:0, ma_train:0 };
  const userSet = new Set();

  maTypes.forEach(t => {
    const ud = (data[t]||{}).user_data || {};
    Object.values(ud).forEach(ld => {
      counts[t] += ld.task_count;
      npus[t]   += ld.gpu_num;
      Object.keys(ld.members).forEach(m => userSet.add(m));
    });
  });

  const grand = npus.ma_devenv + npus.ma_train;
  setText('s-c1', npus.ma_devenv);
  setText('s-c2', npus.ma_train);
  setText('s-c3', userSet.size);
  setText('s-c4', grand);

  const pct = v => grand > 0 ? Math.round(v/grand*100) : 0;
  setWidth('p-c1', pct(npus.ma_devenv));
  setWidth('p-c2', pct(npus.ma_train));
  setWidth('p-c3', userSet.size > 0 ? 100 : 0);
  setWidth('p-c4', 100);

  setText('sub-c1', `${counts.ma_devenv} 个 Notebook`);
  setText('sub-c2', `${counts.ma_train} 个作业`);
  setText('sub-c3', `跨 ${maTypes.length} 类资源`);

  const leaderMap = buildLeaderMap(data, maTypes);

  document.getElementById('chart-quota-title').innerHTML =
    '<span class="icon">◈</span>各小组 MA NPU 占用 / 配额';
  document.getElementById('chart-spec-title').innerHTML =
    '<span class="icon">▦</span>各小组 MA 实例分布（Notebook / 训练）';

  initQuotaChart(leaderMap, data.quotas || {}, true);
  initTeamChart(leaderMap, [
    { key:'ma_devenv', label:'Notebook', color:'#3b82f6', metric:'gpu_num' },
    { key:'ma_train',  label:'训练实验', color:'#10b981', metric:'gpu_num' },
  ]);
  renderDetail(leaderMap, maTypes, data.quotas || {});
}

/* ── main loader ── */
function loadData(force) {
  document.getElementById('loading').style.display = 'flex';
  fetch('/data' + (force ? '?force=1' : ''))
    .then(r => r.json())
    .then(data => {
      _data = data;
      document.getElementById('upd-time').textContent = data.update_time;
      renderByPlatform(data);
    })
    .catch(e => { console.error(e); alert('数据加载失败'); })
    .finally(() => { document.getElementById('loading').style.display = 'none'; });
}

loadData(false);
setInterval(() => loadData(false), 300_000);
</script>
